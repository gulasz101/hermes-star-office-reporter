name: star-office
version: 1.1.0
description: Auto-report Hermes activity to Star Office UI dashboard
author: Wojciech Gula
entry_point: __init__.py
provides_hooks:
  - post_tool_call
  - on_session_start
  - on_session_end
config_schema:
  enabled:
    type: boolean
    default: false
  dashboard_url:
    type: string
    required: true
  report_tool_calls:
    type: boolean
    default: true
  report_file_edits:
    type: boolean
    default: true
  report_commands:
    type: boolean
    default: true
  report_sessions:
    type: boolean
    default: true
  timeout_seconds:
    type: integer
    default: 5
  retry_on_failure:
    type: boolean
    default: false
